spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/products/**

            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: http://localhost:8082
              predicates:
                - Path=/payments/**

            - id: auth-service
              uri: http://localhost:8084
              predicates:
                - Path=/users/**,/auth/**

server:
  port: 8080