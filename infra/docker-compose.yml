services:
  postgres:
    image: postgres:17

    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  auth-service:
    build:
      context: ../services/auth-service
    image: ecommerce-auth-service:1.0
    container_name: ecommerce-auth-service

    environment:
      DB_HOST: postgres
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD}

    ports:
      - "8084:8084"

  product-service:
    build:
      context: ../services/product-service
    image: ecommerce-product-service:1.0
    container_name: ecommerce-product-service

    environment:
      DB_HOST: postgres

    ports:
      - "8083:8083"

  order-service:
    build:
      context: ../services/order-service
    image: ecommerce-order-service:1.0
    container_name: ecommerce-order-service

    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SERVICE_URL: http://payment-service:8082

    ports:
      - "8081:8081"

  payment-service:
    build:
      context: ../services/payment-service
    image: ecommerce-payment-service:1.0
    container_name: ecommerce-payment-service

    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ../services/api-gateway
    image: ecommerce-api-gateway:1.0
    container_name: ecommerce-api-gateway

    ports:
      - "8080:8080"

volumes:
  postgres-data: